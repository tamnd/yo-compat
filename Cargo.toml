[workspace]
resolver = "3"
members = ["crates/yo-compat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tamnd/yo-compat"
homepage = "https://yo.tamnd.dev"
authors = ["tamnd <tamnd87@gmail.com>"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
alloc_instead_of_core = "warn"

# Nothing here is on a measured path. This binary talks to two servers over
# loopback and compares what they say, so the build wants to be quick and the
# panics want to be readable.
[profile.release]
opt-level = 2
debug = 1
